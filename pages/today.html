<div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
  <div>
    <span class="page-eyebrow" id="today-date-label">TU FOCO DE HOY</span>
    <h1 class="page-title m-0">Hoy</h1>
    <p class="page-subtitle mb-0">Solo lo importante para avanzar con calma.</p>
  </div>

  <button
    type="button"
    class="btn btn-primary"
    data-bs-toggle="modal"
    data-bs-target="#task-modal"
  >
    <i class="bi bi-plus"></i> Nueva tarea
  </button>
</div>

<div class="planner-grid">
  <!-- Columna izquierda: Resumen del día + Tareas de hoy + Progreso -->
  <section class="planner-main">

    <!-- 3 métricas rápidas del día -->
    <div class="row g-3 mb-4" id="today-summary">
      <div class="col-12 col-sm-4">
        <div class="today-stat today-stat--todo">
          <span class="today-stat__label">PENDIENTES HOY</span>
          <strong class="today-stat__value" id="stat-today-todo">0</strong>
        </div>
      </div>
      <div class="col-12 col-sm-4">
        <div class="today-stat today-stat--doing">
          <span class="today-stat__label">EN PROGRESO</span>
          <strong class="today-stat__value" id="stat-today-doing">0</strong>
        </div>
      </div>
      <div class="col-12 col-sm-4">
        <div class="today-stat today-stat--done">
          <span class="today-stat__label">COMPLETADAS</span>
          <strong class="today-stat__value" id="stat-today-done">0</strong>
        </div>
      </div>
    </div>

    <!-- Barra de filtro rápido por estado -->
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
      <div class="btn-group gap-2" role="group" aria-label="Filtrar tareas de hoy">
        <button type="button" class="btn btn-sm btn-view is-active" data-today-filter="all">Todas</button>
        <button type="button" class="btn btn-sm btn-view" data-today-filter="Pendiente">Pendientes</button>
        <button type="button" class="btn btn-sm btn-view" data-today-filter="En progreso">En progreso</button>
        <button type="button" class="btn btn-sm btn-view" data-today-filter="Completada">Completadas</button>
      </div>

      <span class="small fw-medium" style="color: var(--muted);" id="today-count">0 tareas para hoy</span>
    </div>

    <!-- Lista de tareas pendientes de hoy -->
    <div class="d-flex flex-column gap-2" id="today-task-list"></div>

    <!-- Franja oscura de progreso (reutiliza progressCard.js) -->
    <div id="today-progress"></div>
    <section id="tasks-progress"></section>

  </section>

  <!-- Columna derecha: Kayos -->
<aside class="planner-aside" id="planner-aside" aria-label="Panel de Kayos"></aside>
</div>
