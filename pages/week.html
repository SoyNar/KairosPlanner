<!-- week.html -->
<div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
  <div>
    <span class="page-eyebrow">MI PLANEADOR</span>
    <h1 class="page-title m-0">Mi semana</h1>
    <p class="page-subtitle mb-0">Todo lo que tienes pendiente, día por día.</p>
    <span class="week-range mt-2">
      <i class="bi bi-calendar3"></i>
      23 – 29 de noviembre
    </span>
  </div>

  <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#task-modal">
    <i class="bi bi-plus"></i> Nueva tarea
  </button>
</div>

<div class="planner-grid">
  <section class="planner-main">
    <div class="week-summary mb-4">
      <article class="week-stat week-stat--pending">
        <strong>00</strong>
        <span>Pendientes</span>
      </article>
      <article class="week-stat week-stat--done">
        <strong>00</strong>
        <span>Completadas</span>
      </article>
      <article class="week-stat week-stat--overdue">
        <strong>00</strong>
        <span>Vencidas</span>
      </article>
    </div>

    <div class="week-board"></div>
  </section>

  <aside class="planner-aside" id="planner-aside" aria-label="Panel de Kayos"></aside>
</div>
