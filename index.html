<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayros Planner</title>

    <!-- Fuentes: preconnect acelera la conexión, y una sola fuente en vez de dos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Librerías -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Core: siempre -->
<link rel="stylesheet" href="css/core/tokens.css">
<link rel="stylesheet" href="css/core/base.css">
<link rel="stylesheet" href="css/core/components.css">
<link rel="stylesheet" href="css/core/layout.css">
<link rel="stylesheet" href="css/core/aside.css">
<link rel="stylesheet" href="css/core/mascot.css">
</head>
<body>
<div class="app-shell">
  <aside id="sidebar" class="sidebar d-none d-md-flex flex-column"></aside>

  <div class="app-main">
    <header class="topbar">
      <nav class="topbar-crumbs" aria-label="Ubicación">
        <span>Espacio personal</span>
        <span class="topbar-sep">/</span>
        <strong id="topbar-title">Mis tareas</strong>
      </nav>

      <div class="topbar-tools">
        <label class="topbar-search">
          <i class="bi bi-search"></i>
          <input type="search" placeholder="Buscar" aria-label="Buscar" />
        </label>
        <span class="topbar-date" id="topbar-date"></span>
        <span class="topbar-avatar">M</span>
      </div>
    </header>

    <main class="content" id="content"></main>
  </div>
</div>

    <nav id="bottom-nav" class="bottom-nav d-md-none"></nav>
    <div id="task-modal-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
